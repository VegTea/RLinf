defaults:
  - model/pi0_5_pytorch@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor: 0-3

runner:
  task_type: sft
  logger:
    log_path: ${oc.env:SFT_OUTPUT_ROOT,./outputs/pi05_droid_openpi_pytorch}
    project_name: rlinf
    experiment_name: pi05_droid_wipe_board_openpi_pytorch
    logger_backends: ["tensorboard"]
  max_epochs: -1
  max_steps: 10000
  val_check_interval: 1000
  save_interval: 1000

data:
  train_data_paths: ${oc.env:WIPE_BOARD_DATASET_PATH,/inspire/hdd/global_user/czxs24230043/data/wipe_board_v1_zed196_force}
  val_data_paths: ${data.train_data_paths}
  episode_split:
    test_episode_count: 20
    seed: 0
    eval_chunks_per_episode: 10

actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 16
  global_batch_size: 64
  eval_batch_size: 5
  seed: 0
  model:
    model_path: ${oc.env:PI05_DROID_RLINF_MODEL_PATH,/inspire/hdd/global_user/czxs24230043/pretrained_models/PI/pi05_droid/pytorch_rlinf}
    num_action_chunks: 15
    action_dim: 8
    num_steps: 10
    openpi:
      task: sft
      config_name: pi05_droid
      num_images_in_input: 3
      action_chunk: ${actor.model.num_action_chunks}
      action_env_dim: ${actor.model.action_dim}
      model_action_dim: 32
      paligemma_variant: gemma_2b
      action_expert_variant: gemma_300m
      max_token_len: 200
      train_expert_only: true
    openpi_data:
      control_frequency_hz: 15.0
      norm_stats_path: ${oc.env:PI05_DROID_RLINF_NORM_STATS,/inspire/hdd/global_user/czxs24230043/pretrained_models/PI/pi05_droid/pytorch_rlinf/assets/wipe_board_v1_zed196_force}
  optim:
    lr: 5.0e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    weight_decay: 1.0e-10
    clip_grad: 1.0
    total_training_steps: ${runner.max_steps}
    lr_warmup_steps: 500
    lr_scheduler: openpi_cosine
    num_cycles: 0.5
    min_lr: 2.5e-6
  fsdp_config:
    strategy: fsdp
    sharding_strategy: full_shard
    use_orig_params: true
    gradient_checkpointing: true
    gradient_checkpointing_use_reentrant: false
    mixed_precision:
      param_dtype: bf16
      reduce_dtype: fp32
      buffer_dtype: fp32
    amp_autocast:
      enabled: false
      precision: bf16

reward:
  use_reward_model: false

critic:
  use_critic_model: false
