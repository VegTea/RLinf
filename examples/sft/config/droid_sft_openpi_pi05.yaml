defaults:
  - model/pi0_5@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: 0-0

runner:
  task_type: sft
  logger:
    log_path: ../results
    project_name: rlinf
    experiment_name: droid_sft_openpi_pi05_wipe_board
    logger_backends: ["tensorboard"]
  max_epochs: -1
  max_steps: 10000
  val_check_interval: -1
  save_interval: 1000

data:
  train_data_paths: /inspire/hdd/global_user/czxs24230043/data/wipe_board_v1_zed196_force

actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 2
  global_batch_size: 16
  seed: 0
  model:
    # Convert gs://openpi-assets/checkpoints/pi05_droid to OpenPI PyTorch first,
    # then export PI05_DROID_MODEL_PATH to that local checkpoint directory.
    model_path: ${oc.env:PI05_DROID_MODEL_PATH}
    precision: null
    num_action_chunks: 15
    action_dim: 8
    add_value_head: false
    openpi:
      config_name: pi05_droid
      num_images_in_input: 2
      action_chunk: ${actor.model.num_action_chunks}
      num_steps: ${actor.model.num_steps}
      train_expert_only: false
      action_env_dim: ${actor.model.action_dim}
      noise_method: flow_sde
      add_value_head: ${actor.model.add_value_head}
      detach_critic_input: true
    # ``norm_stats_path`` must be produced with calculate_norm_stats.py below.
    # It normalizes the velocity actions that the official pi05_droid expects.
    openpi_data:
      control_frequency_hz: 15.0
      norm_stats_path: ${oc.env:PI05_DROID_NORM_STATS}
  optim:
    lr: 2.5e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 1.0e-10
    clip_grad: 1.0
    total_training_steps: ${runner.max_steps}
    lr_warmup_steps: 500
    lr_scheduler: cosine
    num_cycles: 0.5
    min_lr: 2.5e-6
  fsdp_config:
    strategy: fsdp
    sharding_strategy: full_shard
    use_orig_params: false
    gradient_checkpointing: false
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}
