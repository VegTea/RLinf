# Usage:
#   bash examples/recap/value/run_value_sft.sh yam_insert_mouse_battery_sft_value

defaults:
  - model/value@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - _self_
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:REPO_PATH}/examples/sft/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: sft
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "yam_insert_mouse_battery_value_sft"
    logger_backends: ["tensorboard"]

  max_epochs: 30000
  max_steps: -1
  val_check_interval: 500
  save_interval: 1000
  best_checkpoint:
    enable: true
    metric: "eval/value_spearman"
    mode: "max"
    top_k: 3

data:
  data_root: /inspire/qb-ilm/project/gjjproject/public/xl/data/rss_challenge/recap
  tag: insert_mouse_battery

  train_data_paths:
    - dataset_path: phase1/insert_mouse_battery_split/expert/train
      type: "sft"
      weight: 1.0
      robot_type: "yam"
      model_type: "pi05"
    - dataset_path: phase1/insert_mouse_battery_split/success_hil/train
      type: "sft"
      weight: 1.0
      robot_type: "yam"
      model_type: "pi05"
    - dataset_path: phase1/insert_mouse_battery_split/failure/train
      type: "reward"
      weight: 1.0
      robot_type: "yam"
      model_type: "pi05"
    - dataset_path: phase2/insert_mouse_battery_hil_split/train
      type: "sft"
      weight: 1.0
      robot_type: "yam"
      model_type: "pi05"

  eval_data_paths:
    - name: phase1_expert
      dataset_path: phase1/insert_mouse_battery_split/expert/eval
      max_samples: 10000
      robot_type: "yam"
      model_type: "pi05"
    - name: phase1_success_hil
      dataset_path: phase1/insert_mouse_battery_split/success_hil/eval
      max_samples: 10000
      robot_type: "yam"
      model_type: "pi05"
    - name: phase1_failure
      dataset_path: phase1/insert_mouse_battery_split/failure/eval
      max_samples: 10000
      robot_type: "yam"
      model_type: "pi05"
    - name: phase2_hil
      dataset_path: phase2/insert_mouse_battery_hil_split/eval
      max_samples: 10000
      robot_type: "yam"
      model_type: "pi05"

  train_num_workers: 8
  eval_num_workers: 4
  prefetch_factor: 4
  persistent_workers: false
  pin_memory: false

  include_state: true
  gamma: 1.0
  action_horizon: 50
  normalize_to_minus_one_zero: true
  include_next_obs: false
  action_dim: 14
  robot_type: "yam"
  model_type: "pi05"

  balance_weights: true
  seed: 42

algorithm:
  adv_type: gae

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 32
  global_batch_size: 256
  seed: 0

  model:
    precision: bf16
    siglip_path: "/inspire/hdd/global_user/czxs24230043/pretrained_models/google/siglip2-so400m-patch14-224"
    gemma3_path: "/inspire/hdd/global_user/czxs24230043/pretrained_models/google/gemma-3-270m"
    tokenizer_path: "/inspire/hdd/global_user/czxs24230043/pretrained_models/google/gemma-3-270m"
    critic_expert_variant: "gemma_1m"
    freeze_vlm: false
    action_dim: 14
    action_horizon: 50

  optim:
    lr: 5.0e-5
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    weight_decay: 1e-10
    clip_grad: 1.0
    lr_scheduler: "constant"
    lr_warmup_steps: 500
    total_training_steps: 8000

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    use_orig_params: False
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
