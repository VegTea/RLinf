# Compute returns for processed YAM insert-mouse-battery RECAP datasets.
#
# Usage:
#   bash examples/recap/process/run_compute_returns.sh compute_returns_insert_mouse_battery_yam

data:
  data_root: data/recap/insert_mouse_battery
  train_data_paths:
    - dataset_path: expert
      type: sft
    - dataset_path: success_hil
      type: sft
    - dataset_path: failure
      type: reward

  dataset_type: "sft"
  gamma: 1.0
  failure_reward: -2000.0
  tag: insert_mouse_battery
  num_workers: 128

hydra:
  run:
    dir: .
  output_subdir: null
  job:
    chdir: false
