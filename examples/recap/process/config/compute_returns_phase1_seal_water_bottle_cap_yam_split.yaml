# Compute returns for RSS phase1 YAM seal-water-bottle-cap RECAP splits.
#
# Usage:
#   bash examples/recap/process/run_compute_returns.sh compute_returns_phase1_seal_water_bottle_cap_yam_split

data:
  data_root: /inspire/qb-ilm/project/gjjproject/public/xl/data/rss_challenge/recap/phase1/seal_water_bottle_cap_split
  train_data_paths:
    - dataset_path: expert/train
      type: sft
    - dataset_path: expert/eval
      type: sft
    - dataset_path: success_hil/train
      type: sft
    - dataset_path: success_hil/eval
      type: sft
    - dataset_path: failure/train
      type: failure
    - dataset_path: failure/eval
      type: failure

  dataset_type: "sft"
  gamma: 1.0
  failure_reward: -2000.0
  tag: seal-water-bottle-cap
  num_workers: 128

hydra:
  run:
    dir: .
  output_subdir: null
  job:
    chdir: false
