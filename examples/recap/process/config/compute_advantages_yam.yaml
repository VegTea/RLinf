# Advantage computation for YAM RECAP CFG-RL training.
#
# Usage:
#   bash examples/recap/process/run_compute_advantages.sh compute_advantages_yam \
#       advantage.value_checkpoint=/path/to/value_checkpoint

defaults:
  - model/value@advantage.model

advantage:
  value_checkpoint: /path/to/value_checkpoint
  batch_size: 1024
  flush_interval: 256
  num_dataloader_workers_per_gpu: 12
  prefetch_factor: 2
  discount_next_value: true
  positive_quantile: 0.3
  tag: null
  returns_tag: null

  model:
    critic_expert_variant: "gemma_1m"
    tokenizer_path: /path/to/gemma-3-270m
    siglip_path: /path/to/siglip2-so400m-patch14-224
    gemma3_path: /path/to/gemma-3-270m

data:
  model_type: "pi05"
  robot_type: "yam"

  train_data_paths:
    - dataset_path: "/path/to/yam_expert_dataset"
      robot_type: "yam"
      type: "sft"
      weight: 1.0
    - dataset_path: "/path/to/yam_rollout_dataset"
      robot_type: "yam"
      type: "rollout"
      weight: 1.0

  advantage_lookahead_step: 10
  gamma: 1.0

distributed:
  enabled: true
  backend: "nccl"
  timeout: 3600

hydra:
  run:
    dir: .
  output_subdir: null
  job:
    chdir: false
