defaults:
  - env/isaaclab_stack_cube@env.train
  - env/isaaclab_stack_cube@env.eval
  - model/pi0_5@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "isaaclab_ppo_openpi_pi05_table_curriculum_10stage_200_grouped_promotion_mix50"
    logger_backends: ["tensorboard"]

  per_worker_log: true

  max_epochs: 3000
  max_steps: -1

  only_eval: False
  val_check_interval: -1
  save_interval: 40

  resume_dir: null
  ckpt_path: null

algorithm:
  init_emb_dir: null
  init_emb_threshold: 0
  curriculum_delta: 2.5
  emb_buffer_dir: null
  normalize_advantages: True
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0
  rollout_epoch: 2
  eval_rollout_epoch: 20

  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level

  update_epoch: 3
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  filter_rewards: False
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9
  sampling_params:
    do_sample: True
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0
    add_BOS: False

  length_params:
    max_new_token: null
    max_length: 1024
    min_length: 1

env:
  group_name: "EnvGroup"

  train:
    total_num_envs: 128
    max_episode_steps: 450
    max_steps_per_rollout_epoch: 450
    use_fixed_reset_state_ids: True
    seed: 42
    init_params:
      scenario_reset:
        enabled: true
        mode: random
        scenario_file: /inspire/hdd/global_user/gongjingjing-25039/syfei/corriculum_rl/RLinf/rlinf/assets_isaaclab/all_setting/curriculum_10stage_200/Isaaclab_10stage_200_with_distance.jsonl
        loop: true
        curriculum:
          enabled: true
          distance_key: cosine_distance
          stage_manifest_file: /inspire/hdd/global_user/gongjingjing-25039/syfei/corriculum_rl/RLinf/rlinf/assets_isaaclab/all_setting/curriculum_10stage_200/Isaaclab_10stage_200_stage_manifest.json
          # Manifest stages use exact cumulative ids. Thresholds are kept for
          # logging and runner stage count compatibility.
          thresholds:
            - 0.00989311933517456
            - 0.012294411659240723
            - 0.017917275428771973
            - 0.020775020122528076
            - 0.024299979209899902
            - 0.026171326637268066
            - 0.030017435550689697
            - 0.03304260969161987
            - 0.03589385747909546
            - 0.040190041065216064
          initial_stage_index: 0
          # Fallback legacy promotion settings. The active path below is
          # promotion.mode=grouped_moving_average.
          success_threshold: 0.80
          success_thresholds:
            - 0.85
            - 0.85
            - 0.80
            - 0.80
            - 0.80
            - 0.80
            - 0.80
            - 0.80
            - 0.80
            - 0.80
          stable_steps: 3
          require_consecutive_success: false
          sampling:
            mix_schedule:
              - steps: 100000000
                old_ratio: 0.5
                new_ratio: 0.5
          promotion:
            mode: grouped_moving_average
            window: 5
            min_steps_per_stage: 20
            cumulative_success_thresholds:
              - 0.85
            new_success_thresholds:
              - 0.85
              - 0.80
              - 0.70
              - 0.70
              - 0.70
              - 0.70
              - 0.70
              - 0.70
              - 0.70
              - 0.70
            cumulative_floor:
              - 0.85
              - 0.80
              - 0.72
              - 0.72
              - 0.72
              - 0.72
              - 0.72
              - 0.72
              - 0.72
              - 0.72
          diagnostics:
            write_scenario_stats: true
        fixed_ids: []
        external:
          group_a_ids: []
          group_b_ids: []
          ratio_a: 0.8
      grid_reset:
        enabled: false

  eval:
    debug_init_cube_positions: True
    total_num_envs: 32
    max_episode_steps: 450
    max_steps_per_rollout_epoch: 450
    auto_reset: True
    ignore_terminations: True
    use_fixed_reset_state_ids: True
    video_cfg:
      save_video: True
      info_on_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval
    seed: 42
    init_params:
      scenario_reset:
        enabled: true
        mode: random
        scenario_file: /inspire/hdd/global_user/gongjingjing-25039/syfei/corriculum_rl/RLinf/rlinf/assets_isaaclab/all_setting/curriculum_10stage_200/Isaaclab_10stage_200_with_distance.jsonl
        loop: true
        curriculum:
          enabled: false
          distance_key: cosine_distance
          stage_manifest_file: /inspire/hdd/global_user/gongjingjing-25039/syfei/corriculum_rl/RLinf/rlinf/assets_isaaclab/all_setting/curriculum_10stage_200/Isaaclab_10stage_200_stage_manifest.json
          thresholds:
            - 0.00989311933517456
            - 0.012294411659240723
            - 0.017917275428771973
            - 0.020775020122528076
            - 0.024299979209899902
            - 0.026171326637268066
            - 0.030017435550689697
            - 0.03304260969161987
            - 0.03589385747909546
            - 0.040190041065216064
          initial_stage_index: 0
          success_threshold: 0.80
          success_thresholds:
            - 0.85
            - 0.85
            - 0.80
            - 0.80
            - 0.80
            - 0.80
            - 0.80
            - 0.80
            - 0.80
            - 0.80
          stable_steps: 3
          require_consecutive_success: false
          sampling:
            mix_schedule:
              - steps: 100000000
                old_ratio: 0.5
                new_ratio: 0.5
          promotion:
            mode: grouped_moving_average
            window: 5
            min_steps_per_stage: 20
            cumulative_success_thresholds:
              - 0.85
            new_success_thresholds:
              - 0.85
              - 0.80
              - 0.70
              - 0.70
              - 0.70
              - 0.70
              - 0.70
              - 0.70
              - 0.70
              - 0.70
            cumulative_floor:
              - 0.85
              - 0.80
              - 0.72
              - 0.72
              - 0.72
              - 0.72
              - 0.72
              - 0.72
              - 0.72
              - 0.72
          diagnostics:
            write_scenario_stats: true
        fixed_ids: []
        external:
          group_a_ids: []
          group_b_ids: []
          ratio_a: 0.8
      grid_reset:
        enabled: false

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  enable_offload: True
  pipeline_stage_num: 1

  model:
    model_path: "/inspire/hdd/global_user/gongjingjing-25039/syfei/torch/hub/RLinf-pi05-SFT-Stack-cube"
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 32
  global_batch_size: 256
  seed: 42
  enable_offload: False

  model:
    model_path: "/inspire/hdd/global_user/gongjingjing-25039/syfei/torch/hub/RLinf-pi05-SFT-Stack-cube"
    model_type: "openpi"
    action_dim: 7
    num_action_chunks: 5
    num_steps: 5
    add_value_head: True
    openpi:
      config_name: "pi05_isaaclab_stack_cube"
      num_images_in_input: 2
      noise_level: 0.5
      joint_logprob: False
      num_steps: ${actor.model.num_steps}
      value_after_vlm: True
      value_vlm_mode: "mean_token"
      detach_critic_input: True

  optim:
    lr: 5.0e-6
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    clip_grad: 1.0
    weight_decay: 0.01
    critic_warmup_steps: 0

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
