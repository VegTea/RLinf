defaults:
  - env/isaaclab_stack_cube@env.train
  - env/isaaclab_stack_cube@env.eval
  - model/pi0_5@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "isaaclab_ppo_openpi_pi05_table_trajectory_eval"
    logger_backends: ["tensorboard"]

  per_worker_log: true
  max_epochs: 1
  max_steps: -1
  only_eval: True
  val_check_interval: -1
  save_interval: 40

  resume_dir: null
  ckpt_path: null  # Set this to checkpoints/global_step_xxx.pt or pass runner.ckpt_path=... at launch.

algorithm:
  init_emb_dir: null
  init_emb_threshold: 0
  curriculum_delta: 2.5
  emb_buffer_dir: null
  normalize_advantages: True
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0
  rollout_epoch: 1
  eval_rollout_epoch: 1

  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level

  update_epoch: 3
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  filter_rewards: False
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9
  sampling_params:
    do_sample: True
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0
    add_BOS: False

  length_params:
    max_new_token: null
    max_length: 1024
    min_length: 1

env:
  group_name: "EnvGroup"

  train:
    total_num_envs: 128
    max_episode_steps: 450
    max_steps_per_rollout_epoch: 450
    use_fixed_reset_state_ids: True
    seed: 42
    init_params:
      scenario_reset:
        enabled: true
        mode: random
        scenario_file: /inspire/hdd/global_user/gongjingjing-25039/syfei/corriculum_rl/RLinf/rlinf/assets_isaaclab/all_setting/combined_with_distance/Isaaclab_all_scenarios_10025_with_distance.jsonl
        loop: true
        fixed_ids: []
        external:
          group_a_ids: []
          group_b_ids: []
          ratio_a: 0.8
      grid_reset:
        enabled: false

  eval:
    debug_init_cube_positions: True
    total_num_envs: 32
    max_episode_steps: 450
    max_steps_per_rollout_epoch: 450
    auto_reset: True
    ignore_terminations: True
    use_fixed_reset_state_ids: True
    video_cfg:
      save_video: False
      info_on_video: False
      video_base_dir: ${runner.logger.log_path}/video/eval
    reset_snapshot_cfg:
      enabled: true
      output_dir: /inspire/hdd/global_user/gongjingjing-25039/xpyu/project/datasets/isaaclab_2k_traj_success_hit_debug/reset_snapshots
      save_table_png: true
      save_wrist_png: false
      save_metadata: true
    final_snapshot_cfg:
      enabled: true
      output_dir: /inspire/hdd/global_user/gongjingjing-25039/xpyu/project/datasets/isaaclab_2k_traj_success_hit_debug/success_hit_snapshots
      save_table_png: true
      save_wrist_png: false
      save_metadata: true
    trajectory_record_cfg:
      enabled: true
      output_dir: /inspire/hdd/global_user/gongjingjing-25039/xpyu/project/datasets/isaaclab_2k_traj_success_hit
      target_success: 1000
      target_fail: 1000
      record_success: true
      record_fail: true
      stop_when_targets_met: true
      max_eval_rounds: 5000
      state_file: quota_state.json
      manifest_file: manifest.jsonl
      flush_manifest: true
    seed: 42
    init_params:
      disable_table_visual_randomization: true
      scenario_reset:
        enabled: false
        mode: random
        scenario_file: /inspire/hdd/global_user/gongjingjing-25039/syfei/corriculum_rl/RLinf/rlinf/assets_isaaclab/all_setting/combined_with_distance/Isaaclab_all_scenarios_10025_with_distance.jsonl
        loop: true
        curriculum:
          enabled: false
          distance_key: cosine_distance
          thresholds: [0.067, 0.120, 0.154, 0.173, 0.191, null]
          initial_stage_index: 0
          success_threshold: 0.7
          stable_steps: 10
        fixed_ids: []
        external:
          group_a_ids: []
          group_b_ids: []
          ratio_a: 0.8
      cube_pose_random_reset:
        enabled: true
        # Same distribution used to generate cube_pose_50.jsonl:
        # x in [0.2, 0.66], y in [-0.15, 0.15], z fixed, yaw in [-pi, pi],
        # with about 10 cm minimum separation between cube centers.
        min_separation: 0.1
        max_sample_tries: 5000
        pose_range:
          x: [0.2, 0.66]
          y: [-0.15, 0.15]
          z: [0.0203, 0.0203]
          roll: [0.0, 0.0]
          pitch: [0.0, 0.0]
          yaw: [-3.141592653589793, 3.141592653589793]
      grid_reset:
        enabled: false

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  enable_offload: True
  pipeline_stage_num: 1

  model:
    model_path: "/inspire/hdd/global_user/gongjingjing-25039/syfei/torch/hub/RLinf-pi05-SFT-Stack-cube"
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 32
  global_batch_size: 256
  seed: 42
  enable_offload: False

  model:
    model_path: "/inspire/hdd/global_user/gongjingjing-25039/syfei/torch/hub/RLinf-pi05-SFT-Stack-cube"
    model_type: "openpi"
    action_dim: 7
    num_action_chunks: 5
    num_steps: 5
    add_value_head: True
    openpi:
      config_name: "pi05_isaaclab_stack_cube"
      num_images_in_input: 2
      noise_level: 0.5
      joint_logprob: False
      num_steps: ${actor.model.num_steps}
      value_after_vlm: True
      value_vlm_mode: "mean_token"
      detach_critic_input: True

  optim:
    lr: 5.0e-6
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    clip_grad: 1.0
    weight_decay: 0.01
    critic_warmup_steps: 0

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
