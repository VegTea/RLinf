defaults:
  - env/isaaclab_stack_cube@env.train
  - env/isaaclab_stack_cube@env.eval
  - model/pi0_5@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "isaaclab_ppo_openpi_pi05_table_curriculum_075threshold_3hits"
    logger_backends: ["tensorboard"] # wandb, swanlab

  per_worker_log: true

  max_epochs: 1000
  max_steps: -1

  only_eval: False
  val_check_interval: -1
  save_interval: 40 #100

  resume_dir: null # Optional: path to a saved checkpoint directory, such as 'checkpoints/global_step_10'. If not None, it will be used to resume training.
  ckpt_path: null  # Optional: path to a .pt checkpoint. If not None, it will be loaded after the model is instantiated (for evaluation).

algorithm:
  init_emb_dir: null # /path/to/init_emb.npz | Make sure the shape of this .npz is (1408,)
  init_emb_threshold: 0
  curriculum_delta: 2.5
  emb_buffer_dir: null # /path/to/all_init_emb_buffer
  normalize_advantages: True
  kl_penalty: kl # how to estimate kl divergence: kl or kl_penalty
  group_size: 1
  reward_coef: 1.0
  rollout_epoch: 2
  eval_rollout_epoch: 20

  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level

  update_epoch: 3
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  filter_rewards: False
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9
  # params for generation
  sampling_params:
    do_sample: True
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0
    add_BOS: False

  # length argument for autoregressive sampling
  # max length means max amount of tokens to generate
  length_params:
    max_new_token: null
    max_length: 1024
    min_length: 1

env:
  group_name: "EnvGroup"

  train:
    total_num_envs: 128
    max_episode_steps: 450 # for truncation
    max_steps_per_rollout_epoch: 450
    use_fixed_reset_state_ids: True
    seed: 42
    init_params:
      scenario_reset:
        enabled: true
        mode: random
        scenario_file: /inspire/hdd/global_user/gongjingjing-25039/syfei/corriculum_rl/RLinf/rlinf/assets_isaaclab/all_setting/combined_with_distance/Isaaclab_all_scenarios_10025_with_distance.jsonl
        loop: true
        curriculum:
          enabled: true
          distance_key: cosine_distance
          # Cumulative stages by cosine_distance. The first threshold is the
          # 50th smallest distance in the 10025-scenario file.
          thresholds:
            - 0.019309  # ~50 scenarios
            - 0.026172  # ~100 scenarios
            - 0.040191  # ~200 scenarios
            - 0.050676  # ~400 scenarios
            - 0.056533  # ~600 scenarios
            - 0.061962  # ~800 scenarios
            - 0.066992  # ~989 scenarios, previous first stage
            - 0.075086  # ~1200 scenarios
            - 0.098698  # ~1500 scenarios
            - 0.119952  # ~1997 scenarios, previous second stage
            - 0.130781  # ~2500 scenarios
            - 0.139797  # ~3000 scenarios
            - 0.153989  # ~4048 scenarios, previous third stage
            - 0.164049  # ~5000 scenarios
            - 0.172998  # ~5964 scenarios, previous fourth stage
            - 0.181414  # ~7000 scenarios
            - 0.190971  # ~8014 scenarios, previous fifth stage
            - 0.203659  # ~9000 scenarios
            - null      # all scenarios
          initial_stage_index: 0
          success_threshold: 0.75
          # If require_consecutive_success is false, stable_steps means
          # cumulative hits at or above success_threshold within the current stage.
          stable_steps: 3
          require_consecutive_success: false
        fixed_ids: []
        external:
          group_a_ids: []
          group_b_ids: []
          ratio_a: 0.8
      grid_reset:
        enabled: false

  eval:
    debug_init_cube_positions: True
    total_num_envs: 32
    max_episode_steps: 450
    max_steps_per_rollout_epoch: 450
    auto_reset: True
    ignore_terminations: True
    use_fixed_reset_state_ids: True
    video_cfg:
      save_video: True
      info_on_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval
    seed: 42
    init_params:
      scenario_reset:
        enabled: true
        mode: random
        scenario_file: /inspire/hdd/global_user/gongjingjing-25039/syfei/corriculum_rl/RLinf/rlinf/assets_isaaclab/all_setting/combined_with_distance/Isaaclab_all_scenarios_10025_with_distance.jsonl
        loop: true
        curriculum:
          enabled: false
          distance_key: cosine_distance
          thresholds:
            - 0.019309
            - 0.026172
            - 0.040191
            - 0.050676
            - 0.056533
            - 0.061962
            - 0.066992
            - 0.075086
            - 0.098698
            - 0.119952
            - 0.130781
            - 0.139797
            - 0.153989
            - 0.164049
            - 0.172998
            - 0.181414
            - 0.190971
            - 0.203659
            - null
          initial_stage_index: 0
          success_threshold: 0.75
          # If require_consecutive_success is false, stable_steps means
          # cumulative hits at or above success_threshold within the current stage.
          stable_steps: 3
          require_consecutive_success: false
        fixed_ids: []
        external:
          group_a_ids: []
          group_b_ids: []
          ratio_a: 0.8
      grid_reset:
        enabled: false

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  enable_offload: True
  pipeline_stage_num: 1

  model:
    model_path: "/inspire/hdd/global_user/gongjingjing-25039/syfei/torch/hub/RLinf-pi05-SFT-Stack-cube"
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 32
  global_batch_size: 256
  seed: 42
  enable_offload: False

  model:
    model_path: "/inspire/hdd/global_user/gongjingjing-25039/syfei/torch/hub/RLinf-pi05-SFT-Stack-cube"
    model_type: "openpi"
    action_dim: 7
    num_action_chunks: 5
    num_steps: 5
    add_value_head: True
    openpi:
      config_name: "pi05_isaaclab_stack_cube"
      num_images_in_input: 2
      noise_level: 0.5
      joint_logprob: False
      num_steps: ${actor.model.num_steps}
      value_after_vlm: True
      value_vlm_mode: "mean_token"
      detach_critic_input: True

  optim:
    lr: 5.0e-6
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    clip_grad: 1.0
    weight_decay: 0.01
    critic_warmup_steps: 0

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    gradient_checkpointing: False # for openpi, gradient checkpointing is not supported, please do not change this value
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
